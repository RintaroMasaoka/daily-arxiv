name: One-off arXiv trend metadata trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/trends/fetch_trial.py --until-exclusive 2026-10-10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-trend-trial
          path: research/trends/
